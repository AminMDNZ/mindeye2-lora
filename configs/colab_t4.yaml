# Default experiment: adapt the shared-subject MindEye2 model to subject 1 using one
# scanning session (~1 hour of data), on a single Colab T4.
#
# Sizing notes for 16 GB:
#   * pretrain=multisubject_1024 -> hidden_dim 1024 instead of 4096 (upstream reports
#     "very minimal performance impact" for this configuration)
#   * blurry_recon off -> drops the low-level VAE branch, the biggest memory consumer
#   * CLIP embeddings are precomputed, so the 2.5 GB bigG tower is never resident
#   * batch_size 24 matches the paper's fine-tuning recipe and fits comfortably

subj: 1
num_sessions: 1
pretrain: multisubject_1024
average_test_repeats: true
zscore_voxels: true

use_prior: true
blurry_recon: false
upstream_ref: main
clip_backend: open_clip

epochs: 150
# batch_size x grad_accum = 24, matching the paper's effective batch. Split this way
# because the diffusion prior's attention allocates a [batch, 32 heads, 257, 257]
# similarity matrix per layer, which OOMs a T4 at batch 24 regardless of arm.
batch_size: 6
grad_accum: 4
lr: 3.0e-4            # paper's max_lr for full fine-tuning; PEFT arms override below
weight_decay: 1.0e-2
mixup_pct: 0.33
prior_scale: 30.0
clip_scale: 1.0
max_grad_norm: 1.0
precision: fp16
# 8-bit moments are required for the full arm on a 16 GB card: at 729M parameters,
# fp32 AdamW needs ~11.7 GB for params + grads + moments alone. Applied to EVERY arm,
# since using it for one would confound the comparison with an optimiser change.
optimizer: adamw8bit
num_workers: 2
warmup_pct: 0.02

seeds: [0, 1, 2]
eval_every: 10
save_every_min: 10.0
time_budget_min: 150   # stop cleanly before a free-tier session is reclaimed

recon_decoder: none    # switch to sdxl_unclip once you have disk for the 18 GB decoder
recon_n_images: 100
recon_seed: 0
qualitative_n: 8
qualitative_arms: 5
retrieval_fallback: true
retrieval_k: 3

arms:
  - name: frozen
    mode: frozen
    label: "Frozen shared model (ridge only)"

  - name: bitfit
    mode: bitfit
    train_norms: true
    lr: 1.0e-3
    label: "BitFit + LayerNorms"

  - name: lora_r4
    mode: lora
    lora_r: 4
    lora_alpha: 8
    lr: 1.0e-3
    label: "LoRA r=4"

  - name: lora_r16
    mode: lora
    lora_r: 16
    lora_alpha: 32
    lr: 1.0e-3
    label: "LoRA r=16"

  - name: lora_r64
    mode: lora
    lora_r: 64
    lora_alpha: 128
    lr: 1.0e-3
    label: "LoRA r=64"

  - name: full
    mode: full
    label: "Full fine-tune (paper recipe)"
