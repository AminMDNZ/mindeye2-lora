# Two arms, one seed, ten epochs. Use this first: it exercises every stage of the
# pipeline (download -> precompute -> train -> predict -> evaluate -> compare -> report)
# in roughly ten minutes so you find configuration problems before committing hours.

subj: 1
num_sessions: 1
pretrain: multisubject_1024
use_prior: true
blurry_recon: false

epochs: 10
batch_size: 6
grad_accum: 4
lr: 3.0e-4
precision: fp16
optimizer: adamw8bit
num_workers: 2
eval_every: 5
seeds: [0]
time_budget_min: 30

recon_decoder: none
recon_n_images: 16
qualitative_n: 4
qualitative_arms: 3
retrieval_fallback: true
retrieval_k: 3

arms:
  - name: frozen
    mode: frozen
    label: "Frozen (ridge only)"
  - name: lora_r16
    mode: lora
    lora_r: 16
    lora_alpha: 32
    lr: 1.0e-3
    label: "LoRA r=16"
  - name: full
    mode: full
    label: "Full fine-tune"
